# Basic pipeline example
trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - script: |
      python3 --version
      echo "Checked Python version"
    displayName: 'Checking Python Version'

  - script: |
      git --version
      echo "Checked Git version"
    displayName: 'Checking Git Version'

  - script: |
      tree --version
      echo "Checked tree version"
    displayName: 'Checking Tree Version'

  - script: |
      node -v
      echo "Checked Node.js version"
    displayName: 'Checking Node.js Version'